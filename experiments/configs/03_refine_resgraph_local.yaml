# Stage 2 - ResGraph-Local migration.
#
# Runs on a COPY of the baseline index (never refine in place). The tool loads
# the index plus the NEW-space train matrix, rewrites adjacency lists, and
# saves index_path + "_refined".
#
# Consumed by:  refine_index <this file>
# Timing source: "RefineGraph finished. Cost: ..." in the stage log.

index_path: <DATASET_DIR>/indexes/resgraph_local_index
datapath: <NEW_SPACE_H5>
index_name: hgraph
create_params: '{"dim":<DIM>,"dtype":"float32","metric_type":"cosine","index_param":{"base_quantization_type":"fp32","graph_type":"nsw","max_degree":64,"ef_construction":400}}'
num_threads_building: 16

refine_mode: resgraph_local
# Candidate pool reaches two hops in the old graph; inherited one-hop
# survivors are always restored to the exact candidate set.
refine_hop: "2"
# Coarse candidate cap C = multiplier x max_degree ("2" -> C=128). Candidates
# outside the Top-C of the packed sign screen are dropped before exact work.
refine_candidate_cap_multiplier: "2"
# Exact-prune diversification alpha. 1.1 is the paper default; 1.0
# under-prunes (observed ~12 average degree vs. ~23-29 at 1.1).
refine_alpha: "1.1"
# Per-node output degree target after exact pruning.
refine_output_degree: "32"
